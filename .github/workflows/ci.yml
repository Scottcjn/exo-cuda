name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  interweave-tests:
    name: Interweave matmul server tests (CPU)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install numpy pytest
      # The matmul server and its tests are self-contained (numpy + stdlib).
      # Run them outside the exo package tree so pytest does not import
      # exo/__init__.py, which needs the full runtime dependency set.
      - name: Run matmul server test suite
        run: |
          mkdir /tmp/mmtest
          cp exo/interweave/matmul_server.py \
             exo/interweave/test_matmul_server.py \
             exo/interweave/test_gpu_cpu_parity.py /tmp/mmtest/
          cd /tmp/mmtest
          python -m pytest test_matmul_server.py test_gpu_cpu_parity.py -v
