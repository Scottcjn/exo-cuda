name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  interweave-tests:
    name: Interweave matmul server tests (CPU)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install numpy pytest
      - name: Run matmul server test suite
        working-directory: exo/interweave
        run: python -m pytest test_matmul_server.py test_gpu_cpu_parity.py -v
